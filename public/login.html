<title>Kōhi — Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">

<main class="card">
  <h1 class="brand" style="text-align:center; margin:0 0 8px; font-size:2rem;">Kōhi</h1>
  <p style="text-align:center; color:var(--text-muted); margin:0 0 32px; font-size:0.9rem;">
    Inicia sesión en tu cuenta
  </p>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-block" id="submit-btn">Iniciar sesión</button>
  </form>

  <div id="message" class="message"></div>

  <p class="footer-link">¿Aún no tienes cuenta? <a href="register.html">Únete a la lista</a></p>
</main>

<script>
  const form = document.getElementById('login-form');
  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submit-btn');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `message show ${type}`;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(data.error || 'No se pudo iniciar sesión.', 'error');
        submitBtn.disabled = false;
        return;
      }

      localStorage.setItem('kohi_token', data.token);
      showMessage('Sesión iniciada. Redirigiendo...', 'success');
      window.location.href = 'dashboard.html';
    } catch (err) {
      showMessage('No se pudo conectar con el servidor.', 'error');
      submitBtn.disabled = false;
    }
  });
</script>
