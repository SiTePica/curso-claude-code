<title>Kōhi — Unirme a la lista</title>
<link rel="stylesheet" href="styles.css">

<main class="card">
  <h1 class="brand" style="text-align:center; margin:0 0 8px; font-size:2rem;">Kōhi</h1>
  <p style="text-align:center; color:var(--text-muted); margin:0 0 32px; font-size:0.9rem;">
    Únete a la lista de espera
  </p>

  <form id="register-form">
    <div class="field">
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="confirm-password">Confirmar contraseña</label>
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-block" id="submit-btn">Unirme a la lista</button>
  </form>

  <div id="message" class="message"></div>

  <p class="footer-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</main>

<script>
  const form = document.getElementById('register-form');
  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submit-btn');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `message show ${type}`;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (password !== confirmPassword) {
      showMessage('Las contraseñas no coinciden.', 'error');
      return;
    }

    submitBtn.disabled = true;

    try {
      const response = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password }),
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(data.error || 'No se pudo completar el registro.', 'error');
        submitBtn.disabled = false;
        return;
      }

      showMessage(`¡Estás en la lista! Tu posición: #${data.position}`, 'success');
      form.reset();
      submitBtn.disabled = true;
    } catch (err) {
      showMessage('No se pudo conectar con el servidor.', 'error');
      submitBtn.disabled = false;
    }
  });
</script>
